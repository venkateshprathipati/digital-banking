server:
  port: 8080

  servlet:
    context-path: /api

  shutdown: graceful

  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/plain
      - text/css
      - application/javascript

spring:
  application:
    name: digital-banking

  profiles:
    active: dev

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    serialization:
      indent-output: true
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - env
          - beans
          - mappings

  endpoint:
    health:
      show-details: always

    info:
      env:
        enabled: true

logging:
  level:
    root: INFO
    com.novalabs.digitalbanking.account: DEBUG
    org.springframework: INFO
    org.hibernate: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

info:
  application:
    name: Digital Banking Platform
    service: Account Service
    version: 1.0.0
    description: Enterprise Digital Banking Account Service

bank:
  branch-code: HQ001

  notification:
    support-email: support@digitalbank.com
    sms-enabled: true
    email-enabled: true

  account:
    minimum-balance: 1000
    maximum-balance: 10000000
    default-currency: INR
    max-accounts-per-customer: 5
    auto-freeze-days: 90

  transfer:
    daily-limit: 100000
    maximum-per-transaction: 50000

  security:
    otp-length: 6
    otp-expiry-minutes: 5

  interest:
    savings-rate: 3.5
    fixed-deposit-rate: 7.25