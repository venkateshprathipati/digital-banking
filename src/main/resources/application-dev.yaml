###############################################################
# Development Profile
###############################################################

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/digital_banking
    username: banking_app
    password: bankuser
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false

    hikari:
      pool-name: BankingHikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      auto-commit: false

  jpa:
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        generate_statistics: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.bank.account: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  file:
    name: logs/account-service-dev.log

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: account-service

bank:
  transfer-limit: 100000
  minimum-balance: 1000
  currency: INR
  support-email: support-dev@bank.com
  interest-rate: 6.5
  branch-code: DEV001

  notification:
    sms-enabled: true
    email-enabled: true

  account:
    max-accounts-per-customer: 5
    auto-freeze-days: 90